<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>카트 레이싱 보드게임</title>
<style>
:root{--bg:#0a0f1f;--glass:rgba(10,14,32,.86);--line:rgba(255,255,255,.12);--tx:#f1f4ff;--mut:#9aa5cf;--acc:#3b82f6;--gold:#fbbf24}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
button{font-family:inherit;color:inherit;cursor:pointer}
.hidden{display:none!important}
#stage{position:fixed;inset:0;touch-action:none;background:radial-gradient(circle at 50% 40%,#1b2a4a,#070b17)}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform;backface-visibility:hidden}
#board{display:block}
#forkL,#trapL,#pieceL,#fxL{position:absolute;left:0;top:0;width:0;height:0;pointer-events:none}
.kart{position:absolute;left:0;top:0;transition:transform .2s linear;will-change:transform;z-index:2}
.kart.cur{z-index:5}
.kart .kb{position:absolute;left:-40px;top:-27px;width:80px;height:54px;transition:transform .22s ease-out}
.kart .kb svg{display:block;transition:transform .2s}
.kart.stk .kb svg{transform:scale(.72)}
.kart.stk .tagn{font-size:9.5px;top:-40px}
.kart .fire{position:absolute;left:-14px;top:19px;width:22px;height:16px;border-radius:50% 0 0 50%;background:radial-gradient(circle at 80% 50%,#fff 0,#fde047 30%,#f97316 60%,rgba(239,68,68,0) 75%);opacity:0;transform-origin:100% 50%}
.kart.moving .fire{opacity:1;animation:fire .12s infinite alternate}
@keyframes fire{from{transform:scaleX(.7)}to{transform:scaleX(1.25)}}
.kart .tagn{position:absolute;left:0;top:-46px;transform:translateX(-50%);background:var(--c);color:#fff;font-size:11px;font-weight:900;padding:1px 7px;border-radius:9px;border:2px solid #fff;white-space:nowrap;box-shadow:0 2px 4px rgba(0,0,0,.4)}
.kart .kring{position:absolute;left:-34px;top:-34px;width:68px;height:68px;border-radius:50%;border:5px solid var(--c);opacity:0}
.kart.cur .kring{animation:kr 1.1s infinite}
@keyframes kr{0%{transform:scale(.7);opacity:.95}100%{transform:scale(1.35);opacity:0}}
.kart.cur .tagn{animation:bob .8s infinite alternate}
@keyframes bob{to{transform:translate(-50%,-4px)}}
.trap{position:absolute;left:-17px;top:-17px;width:34px;height:34px;border-radius:50%;background:#111;border:3px solid #facc15;font-size:19px;display:flex;align-items:center;justify-content:center}
.flt{position:absolute;transform:translate(-50%,-50%);font-size:27px;font-weight:900;white-space:nowrap;text-shadow:0 0 4px #0b1020,0 2px 0 #0b1020,2px 0 0 #0b1020,-2px 0 0 #0b1020,0 -2px 0 #0b1020;animation:flt 1.5s ease-out forwards;z-index:9}
.pt{position:absolute;width:11px;height:11px;margin:-5px;border-radius:50%;background:#fde047;border:2px solid #b45309;animation:ptf .85s cubic-bezier(.2,.7,.4,1) forwards;z-index:8}
@keyframes ptf{0%{transform:translate(0,0)}100%{transform:translate(var(--dx),calc(var(--dy) + 90px));opacity:0}}
#stage.shake{animation:shk .45s}
@keyframes shk{0%,100%{transform:none}15%{transform:translate(-9px,4px)}30%{transform:translate(8px,-5px)}45%{transform:translate(-6px,-3px)}60%{transform:translate(5px,4px)}80%{transform:translate(-3px,1px)}}
@keyframes flt{0%{transform:translate(-50%,-30%) scale(.6);opacity:0}15%{transform:translate(-50%,-80%) scale(1.15);opacity:1}30%{transform:translate(-50%,-90%) scale(1)}100%{transform:translate(-50%,-260%);opacity:0}}
.sq.hl{stroke:#facc15!important;stroke-width:12!important;animation:hlp .7s infinite alternate}
@keyframes hlp{to{stroke:#fff}}
.ring{animation:ring 1.1s infinite}
@keyframes ring{0%{r:40;stroke-opacity:.95}100%{r:66;stroke-opacity:0}}

/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
#hud>*{pointer-events:auto}
#chips{position:absolute;top:calc(6px + env(safe-area-inset-top));left:calc(6px + env(safe-area-inset-left));right:52px;display:flex;gap:5px}
.chip{flex:1;min-width:0;max-width:150px;background:var(--glass);border-radius:12px;padding:4px 7px 5px;border:2px solid transparent;font-size:10.5px;color:#cfd6f5;line-height:1.35;transition:transform .25s,box-shadow .25s}
.chip.on{border-color:var(--c);box-shadow:0 0 14px var(--c);transform:scale(1.04)}
.chip.done{opacity:.7}
.chip .nm{font-weight:900;font-size:12px;color:#fff;display:flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden}
.chip .nm i{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.chip .nm em{font-style:normal;overflow:hidden;text-overflow:ellipsis}
.chip .rk{margin-left:auto;background:var(--c);color:#fff;border-radius:6px;padding:0 4px;font-size:10px;flex:none}
.chip .st{white-space:nowrap;overflow:hidden}
.chip .lap{height:3px;border-radius:2px;background:rgba(255,255,255,.12);margin-top:3px;overflow:hidden}
.chip .lap b{display:block;height:100%;background:var(--c)}
#tools{position:absolute;top:calc(6px + env(safe-area-inset-top));right:calc(6px + env(safe-area-inset-right));display:flex;flex-direction:column;gap:5px}
#tools button{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--glass);font-size:16px;padding:0;opacity:.92}
#ticker{position:absolute;top:calc(64px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);max-width:72%;font-size:11.5px;background:rgba(0,0,0,.55);color:#e5e9ff;padding:3px 11px;border-radius:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#recenter{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(146px + env(safe-area-inset-bottom));border:none;border-radius:20px;padding:7px 14px;background:var(--acc);font-weight:800;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.4)}
@keyframes pulseC{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.07)}}
@keyframes cardIn{0%{transform:translateY(-40px) rotate(-12deg) scale(1.3);opacity:0}100%{transform:none;opacity:1}}
@keyframes actp{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
/* 하단 기어판 대시보드 */
#dash{position:absolute;left:50%;bottom:calc(4px + env(safe-area-inset-bottom));transform:translateX(-50%);transform-origin:50% 100%;width:min(100vw,560px);display:flex;align-items:flex-end;justify-content:center;gap:4px;padding:0 4px}
#dC{position:relative;width:206px;height:114px;flex:none;background:radial-gradient(ellipse at 50% 100%,#22306a 0,#111733 62%,#0b1026 100%);border-radius:120px 120px 20px 20px;border:2px solid rgba(255,255,255,.22);box-shadow:0 -6px 22px rgba(0,0,0,.55),inset 0 2px 0 rgba(255,255,255,.08)}
#gearSvg{position:absolute;left:3px;top:5px;width:200px;height:103px;overflow:visible}
#gearSvg .gs{opacity:.33;transition:opacity .3s}
#gearSvg .gs.lit{opacity:.62}
#gearSvg .gs.on{opacity:1;stroke:#fff;stroke-width:3.5}
#gearSvg .gn{font-weight:900;font-size:14px;fill:#fff;text-anchor:middle;dominant-baseline:middle;paint-order:stroke;stroke:#0b1020;stroke-width:3}
#gearSvg .gn.on{font-size:19px}
#actBox{position:absolute;left:50%;bottom:4px;width:64px;height:64px;margin-left:-32px}
#act{width:64px;height:64px;border-radius:50%;border:4px solid rgba(255,255,255,.9);background:radial-gradient(circle at 35% 30%,#60a5fa,#1d4ed8 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 4px 18px rgba(37,99,235,.6);padding:0}
#act .i{font-size:24px;line-height:1}
#act .t{font-size:10.5px;font-weight:900;margin-top:1px;text-align:center;line-height:1.1}
#act.go{animation:actp 1s infinite}
#act.end{background:radial-gradient(circle at 35% 30%,#34d399,#047857 70%);box-shadow:0 4px 18px rgba(16,185,129,.55)}
#act.charging{background:conic-gradient(#fde047 0 var(--pw,0deg),#1d4ed8 var(--pw,0deg));transform:scale(1.14);animation:none}
#act:disabled{background:#1b2244;border-color:rgba(255,255,255,.25);box-shadow:none;animation:none}
#act:disabled .i{font-size:20px}
#act:disabled .t{font-size:9.5px;color:#aab3da;max-width:62px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#powWrap{position:absolute;right:-38px;bottom:4px;height:112px;width:30px;z-index:3}
#powBar{position:relative;height:100%;width:100%;border-radius:15px;background:linear-gradient(0deg,#1e3a8a 0 33.3%,#854d0e 33.3% 66.6%,#7f1d1d 66.6%);border:3px solid #fff;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.5)}
#powFill{position:absolute;left:0;right:0;bottom:0;height:100%;transform-origin:50% 100%;background:linear-gradient(0deg,#60a5fa 0 33.3%,#facc15 33.3% 66.6%,#ef4444 66.6%);opacity:.9}
#powBar b{position:absolute;left:0;right:0;text-align:center;font-size:13px;font-weight:900;color:#fff;text-shadow:0 1px 2px #000;z-index:2}
#powBar .z3{top:8%}#powBar .z2{top:42%}#powBar .z1{bottom:8%}
#powMark{position:absolute;left:-3px;right:-3px;height:5px;margin-bottom:-2px;background:#fff;box-shadow:0 0 8px #fff;z-index:3}
#dL,#dR{flex:1;min-width:0;max-width:170px;background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:5px;min-height:96px;display:flex;flex-direction:column;gap:4px}
.dlab{font-size:9.5px;font-weight:900;color:var(--mut);letter-spacing:.5px}
#hand{display:flex;flex-direction:column;gap:4px}
.hc{width:100%;height:30px;border:none;border-radius:8px;background:linear-gradient(90deg,#2a3463,#18203f);border-left:5px solid var(--tc);display:flex;align-items:center;gap:4px;padding:0 5px;box-shadow:0 2px 6px rgba(0,0,0,.4);transition:transform .15s;text-align:left}
.hc:active{transform:scale(.94)}
.hc .e{font-size:17px;line-height:1;flex:none}
.hc .n{font-size:11.5px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hc.dim{filter:saturate(.35) brightness(.72)}
.hc.new{animation:cardIn .5s}
.empty{font-size:10.5px;color:var(--mut);padding:4px 2px;line-height:1.35}
#dLz{font-size:17px;font-weight:900;color:var(--gold);white-space:nowrap}
#dLap{font-size:10.5px;font-weight:800;color:#dbe3ff;white-space:nowrap}
#dShop{display:flex;gap:3px;flex-wrap:wrap}
#dShop .sc{width:28px;height:28px;border-radius:8px;background:linear-gradient(160deg,#7c3aed,#3b0f8a);border:2px solid #c4b5fd;display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer}
#dShop .sc.e{background:rgba(255,255,255,.05);border:2px dashed rgba(255,255,255,.18)}
#dTok{font-size:12px;min-height:14px}
/* 주사위 합계 패널 */
#dsum{position:fixed;left:50%;bottom:calc(132px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:29;pointer-events:none}
.dsx{min-width:200px;background:linear-gradient(160deg,rgba(14,19,44,.97),rgba(30,40,84,.97));border:3px solid var(--c);border-radius:20px;padding:10px 16px;text-align:center;box-shadow:0 0 26px color-mix(in srgb,var(--c) 60%,transparent),0 10px 24px rgba(0,0,0,.5);animation:lcIn .3s cubic-bezier(.2,1.4,.4,1)}
.dsx.out{animation:lcOut .35s forwards}
.dsx .who{font-size:12px;font-weight:900;color:var(--c)}
.dsx .row{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:4px}
.dsx .row i{font-style:normal;width:30px;height:30px;border-radius:7px;background:#fff;color:#1e3a8a;font-weight:900;font-size:19px;display:flex;align-items:center;justify-content:center;border:2px solid var(--c)}
.dsx .row em{font-style:normal;font-size:20px;font-weight:900;color:#cbd5e1}
.dsx .tot{font-size:48px;font-weight:900;color:#fff;line-height:1;text-shadow:0 0 14px var(--c)}
.dsx .tot.bump{animation:bump .45s}
@keyframes bump{0%{transform:scale(1.8);color:#fde047}100%{transform:none}}
.dsx .note{font-size:12px;color:#cbd5e1;margin-top:5px}
.dsx .mod{font-size:14px;font-weight:900;color:#fde047;margin-top:5px;animation:lcIn .3s}
.dsx .go{font-size:18px;font-weight:900;margin-top:6px;padding:4px 10px;border-radius:12px;background:var(--c);color:#fff;animation:lcIn .3s}
/* 아이템 궤적 */
.proj{position:absolute;left:0;top:0;line-height:1;z-index:12;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5))}
.puff{position:absolute;width:16px;height:16px;margin:-8px;border-radius:50%;background:radial-gradient(circle,#fff,rgba(255,255,255,0) 70%);animation:puff .6s forwards;z-index:11}
@keyframes puff{from{transform:scale(1);opacity:.85}to{transform:scale(2.6);opacity:0}}
.boom{position:absolute;left:0;top:0;z-index:13;line-height:1;animation:boom .75s ease-out forwards}
@keyframes boom{0%{transform:translate(-50%,-50%) scale(.2);opacity:1}40%{transform:translate(-50%,-50%) scale(1.4)}100%{transform:translate(-50%,-50%) scale(1.8);opacity:0}}
.ringfx{position:absolute;width:90px;height:90px;margin:-45px;border-radius:50%;border:6px solid var(--c);animation:ringfx .8s ease-out forwards;z-index:10}
@keyframes ringfx{from{transform:scale(.3);opacity:1}to{transform:scale(1.6);opacity:0}}
.beam{position:absolute;left:0;top:0;height:10px;margin-top:-5px;transform-origin:0 50%;border-radius:5px;background:repeating-linear-gradient(90deg,#ef4444 0 14px,#94a3b8 14px 28px);box-shadow:0 0 12px #ef4444;z-index:10;animation:beam 1.2s forwards}
@keyframes beam{0%{opacity:0}15%{opacity:1}85%{opacity:1}100%{opacity:0}}
.tgt{position:absolute;width:84px;height:84px;margin:-42px;border-radius:50%;border:4px dashed var(--c);animation:tgt 1.4s linear forwards;z-index:9}
@keyframes tgt{0%{transform:scale(1.6) rotate(0);opacity:0}20%{transform:scale(1) rotate(60deg);opacity:1}85%{opacity:1}100%{transform:rotate(240deg);opacity:0}}
@media (orientation:landscape){\n  #chips{right:auto;width:min(62vw,620px)}
  #tools{flex-direction:row}
  #ticker{top:calc(58px + env(safe-area-inset-top));left:calc(6px + env(safe-area-inset-left));transform:none;max-width:46vw}
  #tools button{width:36px;height:36px;font-size:15px}
  .chip{padding:3px 6px 4px}
  #dash{transform:translateX(-50%) scale(.88)}
}
}

/* 연출 */
#banner{position:fixed;left:0;right:0;top:40%;height:0;z-index:30;pointer-events:none}
#banner .rib{position:absolute;left:-10%;right:-10%;top:-38px;height:76px;background:linear-gradient(90deg,transparent,var(--c) 18%,var(--c) 82%,transparent);transform:skewY(-4deg) translateX(-120%);display:flex;align-items:center;justify-content:center;box-shadow:0 0 40px var(--c)}
#banner .rib span{font-size:30px;font-weight:900;letter-spacing:1px;text-shadow:0 3px 0 rgba(0,0,0,.35);transform:skewY(4deg);white-space:nowrap}
#banner .rib small{display:block;font-size:13px;font-weight:700;opacity:.9;text-align:center}
#banner.go .rib{animation:rib 1.5s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes rib{0%{transform:skewY(-4deg) translateX(-120%)}22%{transform:skewY(-4deg) translateX(0)}78%{transform:skewY(-4deg) translateX(0)}100%{transform:skewY(-4deg) translateX(120%)}}
#pop{position:fixed;inset:0;z-index:31;display:flex;align-items:center;justify-content:center;pointer-events:none}
.pp{background:radial-gradient(circle at 50% 30%,rgba(255,255,255,.14),rgba(10,14,32,.94) 70%);border:3px solid var(--c);border-radius:24px;padding:14px 26px 16px;text-align:center;box-shadow:0 0 50px var(--c),inset 0 0 30px rgba(255,255,255,.06);animation:pp 1.15s cubic-bezier(.2,1.4,.4,1) forwards;min-width:190px}
.pp .e{font-size:62px;line-height:1.1;animation:wob .6s ease-out}
.pp .t{font-size:21px;font-weight:900;margin-top:2px}
.pp .s{font-size:13px;font-weight:800;color:var(--c);margin-top:2px}
@keyframes pp{0%{transform:scale(.3) rotate(-8deg);opacity:0}18%{transform:scale(1.08);opacity:1}30%{transform:scale(1)}82%{transform:scale(1);opacity:1}100%{transform:scale(.85) translateY(-30px);opacity:0}}
@keyframes wob{0%{transform:scale(.4) rotate(-30deg)}60%{transform:scale(1.25) rotate(10deg)}100%{transform:none}}
#diceFx{position:fixed;inset:0;z-index:29;display:flex;align-items:center;justify-content:center;gap:14px;pointer-events:none}
.dd{width:64px;height:64px;border-radius:14px;background:linear-gradient(145deg,#fff,#dde3f3);box-shadow:0 8px 20px rgba(0,0,0,.5),inset 0 -4px 0 rgba(0,0,0,.12);border:3px solid var(--dc);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:9px;animation:roll .75s cubic-bezier(.3,1.5,.5,1)}
.dd b{width:11px;height:11px;border-radius:50%;background:#1e3a8a;align-self:center;justify-self:center;visibility:hidden}
.dd b.on{visibility:visible}
.dd.out{animation:dout .45s forwards}
@keyframes roll{0%{transform:translateY(calc(var(--h,140px)*-1)) rotate(calc(var(--r,540deg)*-1)) scale(.5);opacity:0}60%{transform:translateY(10px) rotate(15deg) scale(1.1);opacity:1}100%{transform:none}}
@keyframes dout{to{transform:translateY(160px) scale(.4);opacity:0}}
#confetti{position:fixed;inset:0;z-index:35;pointer-events:none}
#land{position:fixed;left:50%;top:calc(92px + env(safe-area-inset-top));transform:translateX(-50%);z-index:28;pointer-events:none;width:min(92vw,360px)}
.lc{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,rgba(15,20,44,.97),rgba(30,38,78,.97));border:3px solid var(--c);border-radius:18px;padding:10px 16px 10px 12px;box-shadow:0 0 26px color-mix(in srgb,var(--c) 70%,transparent),0 10px 24px rgba(0,0,0,.5);animation:lcIn .35s cubic-bezier(.2,1.4,.4,1)}
.lc.out{animation:lcOut .3s forwards}
.lc .le{font-size:44px;line-height:1;flex:none;animation:wob .5s}
.lc .lw{font-size:12px;font-weight:800;color:var(--pc);display:flex;align-items:center;gap:5px}
.lc .lw i{width:9px;height:9px;border-radius:50%;background:var(--pc)}
.lc .lt{font-size:19px;font-weight:900;margin-top:1px}
.lc .ls{font-size:15px;font-weight:900;color:var(--c);margin-top:1px}
@keyframes lcIn{0%{transform:translateY(-30px) scale(.8);opacity:0}100%{transform:none;opacity:1}}
@keyframes lcOut{to{transform:translateY(-20px);opacity:0}}
.sq.landed{stroke:#fff!important;stroke-width:14!important}
.kart .stp{position:absolute;left:24px;top:-30px;min-width:30px;height:30px;padding:0 6px;border-radius:15px;background:#fff;color:#0f172a;font-weight:900;font-size:18px;display:none;align-items:center;justify-content:center;border:3px solid var(--c);box-shadow:0 3px 8px rgba(0,0,0,.4)}
.kart .stp.on{display:flex;animation:stpb .3s}
@keyframes stpb{0%{transform:scale(1.5)}100%{transform:none}}
/* 상점 오버레이 */
#shopOv{position:fixed;inset:0;z-index:38;background:radial-gradient(circle at 50% 45%,rgba(40,20,90,.82),rgba(4,6,16,.9));display:flex;align-items:center;justify-content:center;animation:fadeIn .25s}
@keyframes fadeIn{from{opacity:0}}
.shBox{width:100%;max-width:640px;padding:16px 10px calc(14px + env(safe-area-inset-bottom));text-align:center;pointer-events:none}
.shBox>*{pointer-events:auto}
.shHead{display:inline-flex;gap:12px;align-items:center;background:rgba(0,0,0,.45);border:2px solid #a78bfa;border-radius:20px;padding:6px 16px;font-weight:900;font-size:17px}
.shLz{color:var(--gold)}
.shCards{display:flex;gap:10px;justify-content:center;margin:18px 0 14px;perspective:800px}
.shc{position:relative;width:min(30vw,170px);min-height:min(52vw,250px);border:none;border-radius:16px;padding:0;background:linear-gradient(170deg,#7c3aed,#3b0f8a 55%,#1e0a4a);border:3px solid #c4b5fd;box-shadow:0 10px 28px rgba(0,0,0,.55),inset 0 0 0 3px rgba(255,255,255,.08);display:flex;flex-direction:column;align-items:center;overflow:hidden;animation:shcIn .45s cubic-bezier(.2,1.3,.4,1) backwards;transition:transform .15s}
.noanim .shc{animation:none}
.shc:nth-child(2){animation-delay:.08s}.shc:nth-child(3){animation-delay:.16s}
@keyframes shcIn{from{transform:translateY(80px) rotateX(40deg) scale(.6);opacity:0}}
.shc.ok{box-shadow:0 0 22px #fde047,0 10px 28px rgba(0,0,0,.55);border-color:#fde047}
.shc.ok:active{transform:scale(.95)}

    finish:()=>{pad([262,330,392],.5,.06,0);pad([294,370,440],.5,.06,.45);pad([330,415,494,659],1.6,.07,.9);cheer(2.6,.25,.2);[0,.15,.3].forEach(t=>noise(.3,.25,1+t,6000,'highpass'))},
    buy:()=>{noise(.06,.3,0,2500,'bandpass',null,sfxBus,4);bell(2637,.7,.12,.06,2,2);bell(3136,.9,.1,.12,2,2)},
    banana:()=>{tone(1200,.55,'sine',.13,0,250);noise(.18,.25,.02,700,'lowpass');screech(.4,.14,.1)},
    mine:()=>{boomS(1,0,1.6,2600);for(let i=0;i<6;i++)noise(.06,.1,.3+i*.09,rv(2500),'bandpass',null,sfxBus,6)},
    drift:()=>{screech(.7,.28);engine(220,330,.65,.07)},
    bad:()=>{tone(392,.18,'triangle',.11);tone(330,.18,'triangle',.11,.17);tone(262,.4,'triangle',.11,.34,240)},
    click:()=>{tone(1400,.04,'sine',.06,0,900);noise(.02,.04,0,6000,'highpass')},
    pop:()=>{noise(.18,.12,0,800,'bandpass',4000,sfxBus,2);bell(880,.3,.06,.05,2,1)},
    card:()=>{noise(.12,.25,0,3000,'highpass',8000);noise(.08,.15,.1,1500,'bandpass',null,sfxBus,3);bell(1320,.35,.05,.12,2,1)},
    pw1:()=>engine(90,110,.1,.08),pw2:()=>engine(180,210,.1,.09),pw3:()=>engine(320,380,.12,.1),
  };

  /* ---------- 배경음: 150BPM 경쾌한 레이싱 루프 (합성) ---------- */
  const BPM=150,STEP=60/BPM/4;
  const mtf=m=>440*Math.pow(2,(m-69)/12);
  // 4마디 진행: Am - F - C - G (마디 16스텝)
  const CH=[{r:45,q:[0,3,7]},{r:41,q:[0,4,7]},{r:48,q:[0,4,7]},{r:43,q:[0,4,7]}];
  // B파트 멜로디 (스텝:반음, 마디 기준 루트+24)
  const MEL=[[0,3],[3,4],[6,2],[8,3],[10,1],[12,2],[14,0]];
  let seqT=null,nextT=0,stepN=0;
  function schedStep(n,t){
    const bar=(n>>4)%4,s=n%16,sec=(n>>6)%2,c=CH[bar],r=c.r;
    const at=t-T();
    if(s%4===0){tone(150,.16,'sine',.55,at,42,bgmBus)}                       // 킥
    if(s===4||s===12){noise(.14,.32,at,1900,'bandpass',null,bgmBus,1.2);tone(210,.08,'triangle',.12,at,160,bgmBus)} // 스네어
    if(s%2===1)noise(.03,s%4===3?.13:.06,at,7500,'highpass',null,bgmBus);  // 하이햇
    if(s%2===0){const f=mtf(r+(s%4===2?12:0));tone(f,STEP*1.7,'sawtooth',.16,at,null,bgmBus,700)} // 베이스
    // 아르페지오
    const arp=[0,1,2,1,0,1,2,3][s%8],nt=r+24+(arp===3?12:c.q[arp]);
    tone(mtf(nt),STEP*.9,'square',sec?.035:.05,at,null,bgmBus,2600);
    // B파트 멜로디
    if(sec){const m=MEL.find(x=>x[0]===s);if(m)tone(mtf(r+24+[c.q[0],c.q[1],c.q[2],12,c.q[1]+12][m[1]]),STEP*2.2,'square',.07,at,null,bgmBus,3200)}
    if(s===0&&bar===0)noise(.5,.12,at,9000,'highpass',4000,bgmBus); // 크래시 심벌
  }
  function tick(){if(!ctx)return;while(nextT<T()+.15){schedStep(stepN,nextT);stepN++;nextT+=STEP}}
  function bgmStart(){if(!ctx||!bgmOn||seqT)return;if(ctx.state==='suspended')ctx.resume();nextT=T()+.06;stepN=0;seqT=setInterval(tick,30);
    bgmBus.gain.cancelScheduledValues(T());bgmBus.gain.setValueAtTime(.0001,T());bgmBus.gain.exponentialRampToValueAtTime(.22,T()+1.2)}
  function bgmStop(){if(!seqT)return;clearInterval(seqT);seqT=null;if(ctx){bgmBus.gain.cancelScheduledValues(T());bgmBus.gain.setValueAtTime(bgmBus.gain.value,T());bgmBus.gain.exponentialRampToValueAtTime(.0001,T()+.3)}}
  function duck(){if(!ctx||!seqT)return;const g=bgmBus.gain;g.cancelScheduledValues(T());g.setValueAtTime(g.value,T());g.linearRampToValueAtTime(.08,T()+.05);g.linearRampToValueAtTime(.22,T()+1.4)}

  return{init,play(n){if(!on||!ctx||!L[n])return;try{if(ctx.state==='suspended')ctx.resume();L[n]();if(n==='finish'||n==='myturn')duck()}catch(e){}},
    toggle(){on=!on;store.set('kart_snd',on?'1':'0');return on},get on(){return on},
    bgmToggle(){bgmOn=!bgmOn;store.set('kart_bgm',bgmOn?'1':'0');if(bgmOn){init();bgmStart()}else bgmStop();return bgmOn},get bgmOn(){return bgmOn},
    bgmStart(){init();bgmStart()},bgmStop};
})();

function prevOf(p,id){const pr=PREV[id];if(pr.length===1)return pr[0];const c=p.cameFrom[id];if(c&&pr.includes(c))return c;return id==='n46'?'M1':pr[0]}
const FORK_L={n39:'⬆️ 직진 (❓ 아이템)',L1:'↩️ 상점 길 (🪙×3 → 🛒 → 🪙×2)',T1:'🪙 루찌 길 (×3, ×3, ×3, ×5)',M1:'💨 가운데 지름길 (💥 충돌 -1)',B1:'❓ 아이템 길 (×4)'};
async function chooseFork(p,node,remain){
  const opts=N[node].next;
  if(p.isBot)return botFork(p,node);
  G.hl=opts.slice();publish();
  const v=await askSeat(p,'🔀 갈림길!',`<p>남은 이동 <b>${remain}칸</b> — 어느 길로 갈까요?</p>`,opts.map(o=>({t:FORK_L[o]||o,v:o,cls:'pri'})),'fork',{node,opts,remain});
  G.hl=[];return v||opts[0];
}
async function moveSteps(p,n){
  if(p.finished||!n)return;
  const dir=n>0?1:-1,steps=Math.abs(n);
  G.moving++;G.focus=p.i;G.steps={p:p.i,left:steps,dir};publish();
  try{
    for(let i=0;i<steps;i++){
      let nx;
      if(dir>0){const o=N[p.node].next;if(o.length>1){G.moving--;nx=await chooseFork(p,p.node,steps-i);G.moving++}else nx=o[0];p.cameFrom[nx]=p.node;if(nx==='s0')p.laps++}
      else{nx=prevOf(p,p.node);if(p.node==='s0')p.laps--}
      p.node=nx;G.steps={p:p.i,left:steps-i-1,dir};publish();await sleep(SP.step);
      if(dir>0&&nx==='s0'&&p.laps>=3){finish(p);return}
      if(dir>0&&nx==='s0'){G.moving--;await landCard(p,'🏁','한 바퀴 완주!',`${p.laps+1}바퀴째 돌입 (3바퀴 골인)`,'#fde047','turn','s0');G.moving++}
      if(i<steps-1){G.moving--;await passEffect(p,nx);G.moving++}
    }
  }finally{G.moving--;G.steps=null;publish()}
  if(!p.finished)await arrive(p);
}
async function passEffect(p,id){
  const t=N[id].t;
  if(t==='start'||t==='shop')await openShop(p);
  else if(t==='item')await takeItem(p);
}
async function arrive(p,depth=0){
  if(p.finished||depth>12)return;
  const id=p.node,nd=N[id];
  if(G.traps[id]){
    const t=G.traps[id];delete G.traps[id];G.trapsLeft++;
    log(`${p.name}: ${t==='banana'?'🍌 바나나':'💣 지뢰'}를 밟았다!`);
    fx({k:'pop',e:t==='banana'?'🍌':'💣',t:`${p.name} ${t==='banana'?'미끄덩!':'쾅!'}`,sub:t==='banana'?'바나나 — 기어 3단 ↓':'지뢰 — 뒤로 3칸',c:'#f59e0b',s:t});
    fx({k:'shk'});await sleep(SP.step*3);
    if(await defend(p,t==='banana'?'바나나':'지뢰')){if(t==='banana')await changeGear(p,-3,'바나나');else await moveSteps(p,-3)}
    return;
  }
  await passEffect(p,id);
  switch(nd.t){
    case'lz':
      await landCard(p,'🪙',`루찌 ×${nd.v} 칸`,`루찌 +${nd.v} 획득!`,'#fbbf24',null,id,true);
      p.lz+=nd.v;log(`${p.name}: 🪙 루찌 +${nd.v}`);fx({k:'fl',nd:id,t:`🪙+${nd.v}`,c:'#fde047',s:'coin',pt:1});await sleep(SP.land*.5);break;
    case'gear':
      if(nd.v<0&&hasShop(p,'monster')){log(`${p.name}: 👾 몬스터로 충돌 무시`);await landCard(p,'👾',nd.v===-2?'대형 충돌 칸':'충돌 칸','몬스터 카드로 효과 무시!','#c4b5fd','shield',id);break}
      if(nd.v>0)await landCard(p,'⚙️',`기어 +${nd.v} 칸`,`기어 ${p.gear}단 → ${Math.min(10,p.gear+nd.v)}단`,'#60a5fa',null,id,true);
      else{fx({k:'shk',s:'crash'});const to=Math.max(hasShop(p,'ice')?5:1,p.gear+nd.v);await landCard(p,'💥',nd.v===-2?'대형 충돌!':'충돌!',`기어 ${p.gear}단 → ${to}단`,'#ef4444',null,id,true)}
      await changeGear(p,nd.v,nd.v>0?'기어 칸':(nd.v===-2?'대형 충돌':'충돌'));await sleep(SP.land*.4);break;
    case'mv':{
      const NM={n2o:'N2O 부스트!',boost:'부스터존!',cone:'라바콘',fall:'추락!'}[nd.k];
      if(nd.v<0&&hasShop(p,'monster')){log(`${p.name}: 👾 몬스터로 ${nd.k==='fall'?'추락':'뒤로 이동'} 무시`);await landCard(p,'👾',NM,'몬스터 카드로 효과 무시!','#c4b5fd','shield',id);break}
      log(`${p.name}: ${sqInfo(nd).e} ${nd.v>0?'앞으로':'뒤로'} ${Math.abs(nd.v)}칸`);
      if(nd.k==='fall')fx({k:'shk'});
      await landCard(p,sqInfo(nd).e,NM,`${nd.v>0?'앞으로':'뒤로'} ${Math.abs(nd.v)}칸 이동`,nd.v>0?'#22c55e':'#f97316',nd.v>0?'boost':'bad',id);
      await moveSteps(p,nd.v);break}
    case'drift':
      log(`${p.name}: ↪️ 드리프트 성공!`);await landCard(p,'↪️','드리프트 성공!','화살표 방향 지름길로 이동','#facc15','drift',id);
      p.node=nd.v;publish();await sleep(SP.step*1.5);await arrive(p,depth+1);break;
  }
}
async function landCard(p,e,t,sub,c,snd,nd,quiet){fx({k:'land',p:p.i,e,t,sub,c,s:snd||(quiet?null:'pop'),nd:nd||p.node});await sleep(SP.land)}
function finish(p){
  p.finished=true;G.finishOrder.push(p);p.rank=G.finishOrder.length;
  log(`🏆 ${p.name} 3바퀴 완주! ${p.rank}등`);
  fx({k:'pop',e:'🏆',t:`${p.name} 골인!`,sub:`${p.rank}등`,c:'#fbbf24',s:'finish'});fx({k:'conf'});
  if(!G.finalPhase){G.finalPhase=true;const n=G.players.length;G.finalQueue=[];
    for(let k=1;k<n;k++){const i=(G.cur+k)%n;if(!G.players[i].finished)G.finalQueue.push(i)}
    if(G.finalQueue.length)log('나머지 플레이어는 한 번씩 마지막 차례를 가져요.');}
  publish();
}

/* ---------- 아이템 획득 ---------- */
const BOT_PRI={shield:9,angel:8,devil:7,sbooster:7,magnet:6,missile:6,thunder:6,booster:5,smissile:5,wfly:5,wbomb:4,cloud:4,ufo:4,banana:3,mine:3};
async function takeItem(p){
  const lim=handLimit(p);
  if(p.hand.length>=lim){
    if(p.isBot){const w=p.hand.reduce((a,k,i)=>BOT_PRI[k]<BOT_PRI[p.hand[a]]?i:a,0);
      if(BOT_PRI[p.hand[w]]>4){log(`${p.name}: 손패가 가득 차 아이템을 받지 않음`);return}
      G.itemDiscard.push(p.hand.splice(w,1)[0]);log(`${p.name}: 아이템 1장 버림`)}
    else{
      const v=await askSeat(p,'🃏 손패가 가득 찼어요',`<p>아이템 칸이에요. 최대 <b>${lim}장</b>까지 가질 수 있어요.</p><p>카드를 1장 버리고 새 카드를 받을까요? (이동 중이라 사용은 불가)</p>`,
        [...p.hand.map((k,i)=>({t:`🗑️ ${ITEM_EMO[k]} ${ITEMS[k].n} 버리고 받기`,v:i})),{t:'받지 않기',v:-1}]);
      if(v==null||v<0){log(`${p.name}: 아이템을 받지 않음`);return}
      G.itemDiscard.push(p.hand.splice(v,1)[0]);
    }
  }
  const c=drawItem();if(!c){log('남은 아이템 카드가 없어요.');return}
  p.hand.push(c);log(`${p.name}: ❓ 아이템 카드 획득`);
  fx({k:'land',p:p.i,e:'❓',t:'아이템 칸',sub:'아이템 카드 1장 획득',psub:p.isBot?null:`${ITEM_EMO[c]} ${ITEMS[c].n} 카드 획득!`,c:'#a855f7',s:'item',nd:p.node});await sleep(SP.land*.9);
  publish();
}

const SHOP_PRI=['chaser','ice','white','black','monster','wreck','redmart','brutus','seti','saber','luna','egg','piano'];

async function devilAll(p){for(const q of actives().filter(q=>q!==p)){if(await defend(q,'대마왕')){q.tokens.devil++;log(`${q.name}: 👹 대마왕 토큰`);fx({k:'fl',nd:q.node,t:'👹',c:'#fca5a5'})}}publish()}
// 다른 사람이 아이템을 쓰면: 효과 설명 카드를 보여주고 사람 플레이어가 확인할 때까지 기다림
function itemAck(p,key,tg){
  const local=C.mode==='local';
  const need=G.players.filter(q=>!q.isBot&&(local||q!==p)).map(q=>q.i);
  if(!need.length||TEST)return Promise.resolve();
  return new Promise(res=>{clearTimeout(G.akT);G.ak={id:(G.akId=(G.akId||0)+1),need,key,from:p.i,to:tg.map(q=>q.i),any:local?1:0};G.akRes=res;G.akT=setTimeout(finishAck,30000);publish()});
}
function ackReq(seat,id){if(!G.ak||G.ak.id!==id)return;if(G.ak.any)G.ak.need=[];else G.ak.need=G.ak.need.filter(x=>x!==seat);if(!G.ak.need.length)finishAck();else publish()}
function finishAck(){clearTimeout(G.akT);const r=G.akRes;G.ak=null;G.akRes=null;publish();r&&r()}
async function resolveItem(p,key,sel){
  G.resolving++;publish();
  try{

    const it=ITEMS[key];

    const tg=key==='devil'?actives().filter(q=>q!==p):key==='thunder'?ahead(p):key==='wbomb'?wbTargets(p):(key==='booster'||key==='sbooster'||key==='angel')?[p]:T;
    const nodes=key==='wbomb'?[...new Set([...layer(p.node,4),...layer(p.node,5)])]:(key==='banana'||key==='mine')?[p.node]:[];
    log(`${p.name}: [${it.n}] 사용!${tg.length&&tg[0]!==p?' → '+tg.map(q=>q.name).join(', '):''}`);
    await itemAck(p,key,tg);
    fx({k:'use',p:p.i,key,to:tg.map(q=>q.i),nodes,s:it.t==='공격'?'attack':'item'});
    await sleep(SP.shot!=null?SP.shot:1500);
    switch(key){
      case'devil':await devilAll(p);break;
      case'cloud':{const q=T[0];if(q&&await defend(q,'구름')){q.tokens.cloud++;log(`${q.name}: ☁️ 구름 토큰`);fx({k:'fl',nd:q.node,t:'☁️',c:'#e2e8f0'})}break}
      case'ufo':{const q=T[0];if(q&&await defend(q,'우주선')){q.tokens.ufo++;log(`${q.name}: 🛸 우주선 토큰 (${q.tokens.ufo}개)`);fx({k:'fl',nd:q.node,t:'🛸',c:'#a5f3fc'})}break}
      case'missile':{let hits=0;for(const q of T){if(await defend(q,'미사일')){hits++;fx({k:'shk',s:'crash'});const d=Math.max(0,2+(hasShop(p,'luna')?1:0)-(hasShop(q,'brutus')?1:0));await changeGear(q,-d,'미사일')}}
        if(hits&&hasShop(p,'saber')){log(`${p.name}: 세이버 헬파이어 — 앞으로 ${hits}칸`);await moveSteps(p,hits)}break}
      case'smissile':{const q=T[0];if(q&&await defend(q,'슈퍼 미사일')){fx({k:'shk',s:'crash'});await changeGear(q,-Math.max(0,2-(hasShop(q,'brutus')?1:0)),'슈퍼 미사일')}break}
      case'wbomb':{const ts=wbTargets(p);if(!ts.length)log('물폭탄 범위(4·5번째 칸)에 아무도 없어요.');
        for(const q of ts)if(await defend(q,'물폭탄')){fx({k:'shk',s:'crash'});await changeGear(q,-(3+(hasShop(p,'egg')?2:0)),'물폭탄')}break}
      case'wfly':{const q=T[0];if(q&&await defend(q,'물파리')){fx({k:'shk',s:'crash'});await changeGear(q,-(2+(hasShop(p,'egg')?2:0)),'물파리')}break}
      case'thunder':{const ah=ahead(p);if(ah.length)fx({k:'shk',s:'crash'});for(const q of ah)if(await defend(q,'벼락'))await changeGear(q,-2,'벼락');break}
      case'angel':p.angel=true;log(`${p.name}: 😇 다음 차례까지 함정·공격 무시`);break;
      case'booster':
        if(sel&&sel.super){log(`${p.name}: 세티 — 슈퍼 부스터 효과`);await superBoost(p)}
        else await changeGear(p,2,'부스터');break;
      case'sbooster':await superBoost(p);break;
      case'magnet':{const q=T[0];if(!q)break;const v=roll();G.dice=[v];G.diceOwner=p.i;fx({k:'dice',v:[v],p:p.i});await sleep(SP.dice);log(`${p.name}: 🧲 자석 🎲${v}`);
        const ok=await defend(q,'자석');if(ok)await moveSteps(q,-v);await moveSteps(p,v);
        if(ok&&hasShop(p,'piano')&&!G.over){log(`${p.name}: 🎹 그랜드 피아노 — 모두에게 대마왕!`);fx({k:'pop',e:'🎹',t:'그랜드 피아노',sub:'모두에게 대마왕!',c:'#ef4444',s:'attack'});await devilAll(p)}break}
      case'banana':case'mine':if(canPlaceTrap(p)){G.traps[p.node]=key;G.trapsLeft--;log(`${p.name}: ${ITEM_EMO[key]} 함정 설치`);fx({k:'fl',nd:p.node,t:`${ITEM_EMO[key]} 설치`,c:'#fcd34d',s:'pop'})}break;
    }
    if(key!=='angel')G.itemDiscard.push(key);
  }finally{G.resolving--;publish()}
}

/* ---------- 봇 AI ---------- */
function botFork(p,node){
  if(node==='n38')return p.lz>=4&&p.shop.length<3?'L1':'n39';
  if(node==='n45'){if(p.hand.length<handLimit(p))return'B1';return p.lz<12?'T1':'M1'}
  return N[node].next[0];
}
function sqVal(p,id){
  if(G.traps[id])return -6;const nd=N[id],mon=hasShop(p,'monster');
  switch(nd.t){case'lz':return nd.v;case'gear':return nd.v>0?2*nd.v:(mon?0:3*nd.v);case'mv':return nd.v>0?nd.v+1:(mon?0:-3);case'item':return p.hand.length<handLimit(p)?2:0;case'drift':return 4;default:return 1}
}
function botLandVal(p,steps){let n=p.node;for(let i=0;i<steps;i++){const o=N[n].next;n=o.length>1?botFork(p,n):o[0];if(n==='s0'&&p.laps>=2)return 99}return sqVal(p,n)+steps*.6}
function botDecide(p,key,phase){
  const others=actives().filter(q=>q!==p);if(!others.length)return null;const f=firstList();
  if(phase==='pre')switch(key){
    case'devil':return{};
    case'cloud':{const q=others.sort((a,b)=>prog(b)-prog(a))[0];return{t:[q.i]}}
    case'ufo':case'smissile':return f.includes(p)?null:{t:[f[Math.random()*f.length|0].i]};
    case'missile':{const ah=ahead(p).sort((a,b)=>b.gear-a.gear);if(!ah.length)return null;return{t:(hasShop(p,'saber')?ah.slice(0,2):[ah[0]]).map(q=>q.i)}}
    case'wfly':{const l=justAheadList(p);return l.length?{t:[l[0].i]}:null}
    case'thunder':return ahead(p).length?{}:null;
    case'magnet':{const ah=ahead(p).sort((a,b)=>prog(b)-prog(a));return ah.length?{t:[ah[0].i]}:null}
    case'wbomb':return wbTargets(p).length?{}:null;
    case'booster':if(hasShop(p,'seti')&&p.gear>=8)return null;return p.gear<=8?{}:null;
  }else switch(key){
    case'sbooster':return{};
    case'booster':return hasShop(p,'seti')?{super:true}:(p.gear<=9?{}:null);
    case'banana':case'mine':return canPlaceTrap(p)&&others.some(q=>prog(q)<prog(p))?{}:null;
  }
  return null;
}
async function waitIdle(){while(G.resolving||G.pr||G.cardBusy||G.moving)await sleep(80)}
async function botStep(fn){await waitIdle();G.botActing=true;publish();try{await fn()}finally{G.botActing=false;publish()}await sleep(SP.bot)}
async function botItems(p,phase){
  for(let g=0;g<6&&!p.finished&&!G.over;g++){
    let sel=null,key=null;
    for(const k of [...new Set(p.hand)]){sel=botDecide(p,k,phase);if(sel){key=k;break}}
    if(!key)return;
    await botStep(()=>resolveItem(p,key,sel));
  }
}

async function basicMove(p){

  log(`${p.name}: 🎲 ${n}개 → ${d.join(', ')}${note?' ('+note+')':''}`);

  const tot=()=>d.reduce((a,b)=>a+b,0);

  if(hasShop(p,'white')){
    let v=-1;
    if(p.isBot)v=d.indexOf(1);
    else v=await askSeat(p,'🤍 백기사',`<p>나온 눈: <b style="font-size:20px">${d.join(' · ')}</b> (합계 ${tot()})</p><p>주사위 1개를 골라 다시 굴릴 수 있어요 (차례마다 1번).</p>`,[...d.map((x,i)=>({t:`🎲 ${x} 다시 굴리기`,v:i})),{t:'그대로 진행',v:-1,cls:'pri'}]);
    if(v!=null&&v>=0){const old=d[v];d[v]=roll();G.dice=d.slice();fx({k:'dice',v:d.slice(),p:p.i});log(`${p.name}: 백기사 — 다시 굴림 → ${d.join(', ')}`);await sleep(SP.dice);
      fx({k:'sum',p:p.i,v:d.slice(),total:tot(),note:`🤍 백기사 — ${old} 다시 굴림 → ${d[v]}`});await sleep(SP.land*.9)}
  }
  if(t.cloud&&d.includes(3)){d=d.map(x=>x===3?1:x);G.dice=d.slice();fx({k:'mod',p:p.i,e:'☁️',t:'구름 — 3이 모두 1로',total:tot(),s:'bad'});log(`${p.name}: ☁️ 구름 — 3을 1로 → ${d.join(', ')}`);await sleep(SP.land*.9)}
  if(t.devil||t.ufo||t.cloud){t.devil=t.ufo=t.cloud=0;publish()}
  let sum=tot();
  if(hasShop(p,'black')){sum+=1;log(`${p.name}: 🖤 흑기사 +1칸`);fx({k:'mod',p:p.i,e:'🖤',t:'흑기사 — 반드시 1칸 더',total:sum,s:'boost'});await sleep(SP.land*.9)}
  if(hasShop(p,'wreck')&&sum>1){
    let less;
    if(p.isBot)less=botLandVal(p,sum-1)>botLandVal(p,sum)+.5;
    else less=await askSeat(p,'🔧 렉키',`<p>지금 <b>${sum}칸</b>이에요. 몇 칸 이동할까요?</p>`,[{t:`${sum}칸 이동`,v:false,cls:'pri'},{t:`${sum-1}칸 이동 (1칸 덜)`,v:true}]);
    if(less){sum--;log(`${p.name}: 렉키 — 1칸 덜 이동`);fx({k:'mod',p:p.i,e:'🔧',t:'렉키 — 1칸 덜',total:sum});await sleep(SP.land*.9)}
  }
  log(`${p.name}: ${sum}칸 이동`);
  fx({k:'go',p:p.i,total:sum});await sleep(SP.land*.7);
  await moveSteps(p,sum);
}
async function takeTurn(p){

    await botStep(async()=>{await changeGear(p,1,'기어 올리기');if(hasShop(p,'chaser')&&p.gear<10)await changeGear(p,1,'쉐퍼')});
    await botItems(p,'pre');
    if(!p.finished&&!G.over)await botStep(()=>basicMove(p));
    if(!p.finished&&!G.over)await botItems(p,'post');
  }else{
    await changeGear(p,1,'기어 올리기');
    if(hasShop(p,'chaser')&&p.gear<10){const y=await askSeat(p,'🏎️ 쉐퍼','<p>기어를 1단 더 올릴까요?</p>',[{t:'⚙️ 올리기',v:1,cls:'pri'},{t:'그대로',v:0}]);if(y)await changeGear(p,1,'쉐퍼')}
    await waitMain(p,'roll');
    if(!p.finished){G.turnBusy++;publish();try{await basicMove(p)}finally{G.turnBusy--;publish()}}
    if(!p.finished&&!G.over)await waitMain(p,'end');
  }
  await waitIdle();endTurnCleanup();publish();
}
async function loop(){
  while(!G.over){
    const p=G.players[G.cur];
    if(!p.finished)await takeTurn(p);
    if(G.finalPhase){let nx=null;while(G.finalQueue.length){const i=G.finalQueue.shift();if(!G.players[i].finished){nx=i;break}}if(nx===null)break;G.cur=nx;continue}
    G.cur=(G.cur+1)%G.players.length;
  }
  G.over=true;G.ms=null;fx({k:'conf'});publish();
  if(TEST){console.log('GAMEOVER',G.finishOrder.map(p=>p.name).join(','),G.logs.length);window.__done=true}
}

function hudPads(){if(innerWidth>innerHeight)return{t:58,b:108};return{t:72,b:126}}
function frame(){
  requestAnimationFrame(frame);

  const B=BOUNDS[ORIENT],W=innerWidth,H=innerHeight,pad=hudPads(),bw=B.w*S0,bh=B.h*S0,vh=H-pad.t-pad.b;
  let z,cx,cy;
  if(cam.mode==='all'){z=Math.min(W/bw,vh/bh)*.98;cx=bw/2;cy=bh/2}
  else{z=cam.zoom;
    if(cam.manual){cx=cam.mx;cy=cam.my}
    else{const f=PIECES[C.S.fc!=null?C.S.fc:C.S.cur]||PIECES[0];cx=f.tx;cy=f.ty}

/* ---------- 갈림길: 지도 터치로 선택 ---------- */
const FK_COL=['#22d3ee','#f472b6','#a3e635'];
function branchPath(opt,remain){const path=[opt];let n=opt;for(let i=1;i<remain;i++){n=N[n].next[0];if(!n)break;path.push(n);if(n==='s0')break}return path}
let forkCtx=null;
function openFork(pr){
  const x=pr.x||{},S=C.S;forkCtx={id:pr.id,opts:x.opts||[],paths:{}};
  let html='';const ctr=[W2(x.node)];
  forkCtx.opts.forEach((o,j)=>{const col=FK_COL[j%3],path=branchPath(o,x.remain||1);forkCtx.paths[o]=path;
    const a=W2(x.node),b=W2(o),ang=Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI;
    path.forEach((n,k)=>{const c=W2(n);if(k>0&&k<path.length-1)html+=`<div class="fkDot" style="--c:${col};transform:translate(${c.x}px,${c.y}px)"></div>`});
    html+=`<div style="position:absolute;transform:translate(${b.x}px,${b.y}px)"><div class="fkPin" style="--c:${col}"></div></div><div style="position:absolute;transform:translate(${b.x}px,${b.y}px)"><div class="fkArr" style="--c:${col};transform:rotate(${ang}deg)">➜</div></div>`;
    const e=W2(path[path.length-1]);ctr.push(e);
    html+=`<div style="position:absolute;transform:translate(${e.x}px,${e.y}px)"><div class="fkPin" style="--c:${col};border-style:dashed"></div><div class="fkEnd" style="--c:${col}">🏁 ${j+1}번 길 도착</div></div>`;
  });
  $('#forkL').innerHTML=html;
  const NMS={n39:'직진 ❓',L1:'상점 길 🛒',T1:'루찌 길 🪙',M1:'지름길 💥',B1:'아이템 길 ❓'};
  const h=$('#forkHint');h.innerHTML=`<div class="h">🔀 갈림길! 갈 방향의 칸을 터치하세요</div><div class="s">${C.mode==='local'?esc(S.pl[pr.seat].n)+' · ':''}남은 이동 ${x.remain}칸 · 점선 칸이 각 길의 도착 지점</div><div class="ops">${forkCtx.opts.map((o,j)=>`<button data-o="${o}" style="--c:${FK_COL[j%3]}">${j+1}. ${NMS[o]||o}</button>`).join('')}</div>`;
  h.classList.remove('hidden');h.querySelectorAll('button').forEach(b=>b.onclick=()=>pickFork(b.dataset.o));
  // 카메라: 갈림길과 도착 지점이 보이게
  const xs=ctr.map(c=>c.x),ys=ctr.map(c=>c.y);cam.mode='follow';cam.manual=true;
  cam.mx=(Math.min(...xs)+Math.max(...xs))/2;cam.my=(Math.min(...ys)+Math.max(...ys))/2;
  const pad=hudPads(),span=Math.max(Math.max(...xs)-Math.min(...xs)+160,(Math.max(...ys)-Math.min(...ys)+160)*innerWidth/Math.max(200,innerHeight-pad.t-pad.b-120));
  cam.zoom=Math.max(.45,Math.min(1,innerWidth/span));syncCamBtns();SFX.play('pop');
}
function pickFork(o){if(!forkCtx||!forkCtx.opts.includes(o))return;SFX.play('click');vib(25);const id=forkCtx.id;closeFork();follow();sendAns(id,o)}
function closeFork(){forkCtx=null;$('#forkL').innerHTML='';$('#forkHint').classList.add('hidden')}
function stageTap(cx,cy){
  if(!forkCtx)return;const wx=(cx-cam.tx)/cam.z,wy=(cy-cam.ty)/cam.z;let best=null,bd=1e9;
  for(const o of forkCtx.opts)for(const n of forkCtx.paths[o]){const c=W2(n),d=Math.hypot(c.x-wx,c.y-wy);if(d<bd){bd=d;best=o}}
  if(best&&bd<56)pickFork(best);
}

function syncPrompt(){
  const S=C.S,pr=S&&S.pr;
  if(peekWhat==='sheet'&&(!pr||pr.id!==C.shownPr))peekOff('sheet');
  const mineP=pr&&pr.seat===C.seat&&C.mode&&!S.ov;
  if(!(mineP&&pr.k==='shop')&&shopCtx)closeShopOv();
  if(!(mineP&&pr.k==='fork')&&forkCtx)closeFork();
  if(mineP&&pr.k==='shop'){const me=S.pl[C.seat],sig=pr.id+'|'+me.lz+'|'+me.sh.join()+'|'+S.sf.join();if(!shopCtx||shopCtx.sig!==sig){if(sheetCtx)closeSheet();const anim=!shopCtx||shopCtx.id!==pr.id;openShopOv(pr,anim);shopCtx.sig=sig}return}
  if(mineP&&pr.k==='fork'){if(!forkCtx||forkCtx.id!==pr.id){if(sheetCtx)closeSheet();openFork(pr)}return}
  if(mineP){
    if(C.shownPr===pr.id&&sheetCtx&&sheetCtx.kind==='prompt')return;
    C.shownPr=pr.id;
    let body=pr.body;
    if(pr.k==='shop'){const me=S.pl[C.seat];
      body=`<p>🪙 내 루찌 <b style="color:var(--gold);font-size:18px">${me.lz}</b> · 상점 카드 ${me.sh.length}/3장</p>`+(S.sf.length?'':'<p class="muted">진열된 카드가 없어요.</p>')+
        S.sf.map((k,i)=>{const s=SHOPS[k],own=me.sh.includes(k);return`<div class="scard"><div class="h"><span>${SHOP_EMO[k]} ${s.n}</span><span class="c">🪙${s.c}</span></div><div class="d">${s.d}</div><button data-v="b${i}" ${own||me.lz<s.c?'disabled':''}>${own?'이미 보유 (같은 카드는 1장만)':me.lz<s.c?'루찌 부족':'구매하기'}</button></div>`}).join('')}
    const ttl=C.mode==='local'?`<span style="background:${S.pl[pr.seat].c};border-radius:8px;padding:1px 8px;font-size:14px">${esc(S.pl[pr.seat].n)}</span> ${pr.title}`:pr.title;
    openSheet(ttl,body,pr.btns,v=>{
      const val=pr.btns.some(b=>String(b.v)===String(v))?pr.btns.find(b=>String(b.v)===String(v)).v:v;
      sendAns(pr.id,val)},'prompt');
    SFX.play('pop');
  }else if(sheetCtx&&sheetCtx.kind==='prompt'){closeSheet()}
}

if(QS.includes('fakepeer')){ // 테스트용 가짜 PeerJS (같은 브라우저 탭끼리)
  const bc=new BroadcastChannel('fakepeer');
  class FConn{constructor(pe,remote,id){this.peer=remote;this.open=false;this.h={};this._p=pe;this.id=id}on(e,f){(this.h[e]=this.h[e]||[]).push(f)}emit(e,a){(this.h[e]||[]).forEach(f=>f(a))}send(d){bc.postMessage({t:'data',to:this.peer,from:this._p.id,cid:this.id,d:JSON.parse(JSON.stringify(d))})}}
  window.Peer=class{constructor(id){this.id=typeof id==='string'?id:'p'+Math.random().toString(36).slice(2,8);this.h={};this.conns={};
    bc.addEventListener('message',e=>{const m=e.data;if(m.to!==this.id)return;
      if(m.t==='conn'){const c=new FConn(this,m.from,m.cid);this.conns[m.cid]=c;this.emit('connection',c);setTimeout(()=>{c.open=true;c.emit('open');bc.postMessage({t:'ack',to:m.from,from:this.id,cid:m.cid})},10)}
      if(m.t==='ack'){const c=this.conns[m.cid];if(c){c.open=true;c.acked=true;c.emit('open')}}
      if(m.t==='data'){const c=this.conns[m.cid];if(c)c.emit('data',m.d)}});
    setTimeout(()=>this.emit('open',this.id),20)}
    on(e,f){(this.h[e]=this.h[e]||[]).push(f)}emit(e,a){(this.h[e]||[]).forEach(f=>f(a))}
    connect(id){const cid='c'+Math.random().toString(36).slice(2,8);const c=new FConn(this,id,cid);this.conns[cid]=c;bc.postMessage({t:'conn',to:id,from:this.id,cid});setTimeout(()=>{if(!c.acked)this.emit('error',{type:'peer-unavailable'})},1500);return c}
    destroy(){}reconnect(){}};
}
if(QS.includes('mock')){ // 테스트용 가짜 room (같은 브라우저 탭끼리)
  const bc=new BroadcastChannel('mockroom'),me=Math.random().toString(36).slice(2,8);
  window.claude={use:async n=>n!=='room'?null:{join:async name=>{
    const peers=new Map();let mine={};const subs=[];
    const snap=()=>[{peer:me,isMe:true,sameTab:true,kind:'viewer',guest:false,presence:mine,updatedAt:Date.now()},...peers.values()];
    const notify=()=>{const s=snap();subs.forEach(f=>f({peers:s,joined:[],left:[],updated:[]}))};
    bc.addEventListener('message',e=>{const m=e.data;if(m.room!==name)return;if(m.t==='p'){peers.set(m.peer,{peer:m.peer,isMe:false,sameTab:false,kind:'viewer',guest:false,presence:m.pres,updatedAt:Date.now()});notify()}if(m.t==='hi')bc.postMessage({room:name,t:'p',peer:me,pres:mine})});
    bc.postMessage({room:name,t:'hi'});
    return{name,presence:async pt=>{mine={...mine,...pt};for(const k in pt)if(pt[k]===null)delete mine[k];bc.postMessage({room:name,t:'p',peer:me,pres:JSON.parse(JSON.stringify(mine))});notify()},
      peers:snap,onPeers:fn=>{subs.push(fn);setTimeout(()=>fn({peers:snap(),joined:snap(),left:[],updated:[]}),0);return()=>{}},connected:()=>true,onConnection:fn=>{setTimeout(()=>fn(true));return()=>{}},leave:async()=>{}};
  }}};
}
/* ---------- P2P 연결 (Claude 밖에서 열었을 때: PeerJS 무료 서버로 기기끼리 직접 연결) ---------- */
function loadScript(src){return new Promise((res,rej)=>{const sc=document.createElement('script');sc.src=src;sc.onload=res;sc.onerror=rej;document.head.appendChild(sc)})}
async function peerRoomApi(){
  if(!window.RTCPeerConnection&&!window.Peer)return null;
  if(!window.Peer){
    for(const u of['https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js','https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js']){try{await loadScript(u);if(window.Peer)break}catch(e){}}
  }
  if(!window.Peer)return null;
  return{join:(name,role)=>peerJoin(name,role)};
}
function peerJoin(name,role){
  return new Promise((resolve,reject)=>{
    const hostId='kartrace-'+name+'-v1';
    let peer;try{peer=role==='host'?new Peer(hostId,{debug:0}):new Peer({debug:0})}catch(e){reject(e);return}
    let mine={},others=new Map(),myPeer=null,hostConn=null,closed=false,done=false,sendQ=false,notifyQ=false;
    const conns=new Map(),subs=[];
    const snap=()=>[{peer:myPeer||'me',isMe:true,sameTab:true,kind:'viewer',guest:false,presence:mine},...[...others].map(([id,pr])=>({peer:id,isMe:false,sameTab:false,kind:'viewer',guest:false,presence:pr||{}}))];
    const notify=()=>{if(notifyQ)return;notifyQ=true;setTimeout(()=>{notifyQ=false;const sn=snap();subs.forEach(f=>{try{f({peers:sn,joined:[],left:[],updated:[]})}catch(e){console.error(e)}})},0)};
    const flush=()=>{sendQ=false;
      if(role==='host'){const msg={t:'all',list:[[myPeer,mine],...others]};conns.forEach(c=>{if(c.open)try{c.send(msg)}catch(e){}})}
      else if(hostConn&&hostConn.open){try{hostConn.send({t:'pres',p:mine})}catch(e){}}};
    const schedule=()=>{if(!sendQ){sendQ=true;setTimeout(flush,30)}};
    const api={name,
      presence:async pt=>{mine={...mine,...pt};for(const k in pt)if(pt[k]===null)delete mine[k];notify();schedule()},
      peers:snap,onPeers:fn=>{subs.push(fn);setTimeout(()=>fn({peers:snap(),joined:snap(),left:[],updated:[]}),0);return()=>{}},
      connected:()=>!closed,onConnection:fn=>{setTimeout(()=>fn(true));return()=>{}},
      leave:async()=>{closed=true;try{peer.destroy()}catch(e){}}};
    const finish=()=>{if(!done){done=true;resolve(api)}};
    let retryT=null;
    const connect=()=>{if(closed||hostConn)return;clearTimeout(retryT);
      const c=peer.connect(hostId,{reliable:true});
      c.on('open',()=>{hostConn=c;finish();schedule()});
      c.on('data',m=>{if(m&&m.t==='all'&&Array.isArray(m.list)){others=new Map(m.list.filter(x=>x[0]!==myPeer));notify()}});
      c.on('close',()=>{if(hostConn===c)hostConn=null;others.clear();notify();retryT=setTimeout(connect,3000)});
      c.on('error',()=>{});};
    peer.on('open',id=>{myPeer=id;
      if(role==='host'){
        peer.on('connection',c=>{
          c.on('open',()=>{conns.set(c.peer,c);schedule()});
          c.on('data',m=>{if(m&&m.t==='pres'){others.set(c.peer,m.p||{});notify();schedule()}});
          const drop=()=>{conns.delete(c.peer);if(others.delete(c.peer)){notify();schedule()}};
          c.on('close',drop);c.on('error',drop)});
        finish();
      }else{connect();setTimeout(finish,8000)}
    });
    peer.on('error',e=>{
      if(role==='guest'&&e&&e.type==='peer-unavailable'){hostConn=null;retryT=setTimeout(connect,3000);finish();return}
      if(!myPeer&&!done){done=true;reject(e)}
    });
    peer.on('disconnected',()=>{if(!closed)try{peer.reconnect()}catch(e){}});
    setTimeout(()=>{if(!done){done=true;try{peer.destroy()}catch(e){}reject(new Error('연결 시간 초과'))}},15000);
  });
}
async function getRoomApi(){
  if(C.roomApi)return C.roomApi;
  let api=null;
  try{if(window.claude&&window.claude.use)api=await Promise.race([window.claude.use('room'),sleep(11000).then(()=>null)])}catch(e){api=null}
  if(api)C.net='claude';
  else{try{api=await peerRoomApi()}catch(e){api=null}if(api)C.net='p2p'}
  C.roomApi=api;return api;
}
const roomPeers=()=>{try{return C.room?C.room.peers():[]}catch(e){return[]}};
function guestList(){
  const seen=new Set(),out=[];
  roomPeers().forEach(pe=>{const pr=pe.presence||{};if(pe.isMe||pr.host||!pr.cid||!pr.nm||seen.has(pr.cid))return;seen.add(pr.cid);out.push({cid:pr.cid,nm:String(pr.nm).slice(0,10)})});
  return out.slice(0,3);
}
function onHostPeers(){
  if(C.mode!=='host')return;
  if(C.lobby){renderLobby();return}
  if(!G)return;
  const now=Date.now();
  roomPeers().forEach(pe=>{const pr=pe.presence||{};if(pe.isMe||!pr.cid)return;
    const pl=G.players.find(p=>p.cid===pr.cid);if(!pl)return;pl.seen=now;
    const rid=pr.rq&&pr.rq.id?pr.rq.id:null;
    if(!(pr.cid in C.lastRqId))C.lastRqId[pr.cid]=rid;
    else if(rid&&C.lastRqId[pr.cid]!==rid){C.lastRqId[pr.cid]=rid;handleReq(pl.i,pr.rq)}
    if(pr.ans&&G.pr&&pr.ans.id===G.pr.id&&G.pr.seat===pl.i)answerPrompt(pl.i,pr.ans.id,pr.ans.v);
  });
}
setInterval(()=>{ // 연결이 끊긴 친구 자동 진행
  if(C.mode!=='host'||!G||G.over)return;const now=Date.now();
  const gone=i=>{const p=G.players[i];return p&&!p.isBot&&p.cid&&p.cid!==C.cid&&now-p.seen>45000};
  if(G.pr&&gone(G.pr.seat)){const en=G.pr.btns.filter(b=>!b.dis);log(`${G.players[G.pr.seat].name}: 연결 끊김 — 자동 선택`);answerPrompt(G.pr.seat,G.pr.id,en.length?en[en.length-1].v:null)}
  if(G.ms!=null&&G.mainRes&&gone(G.ms)&&engineIdle()){log(`${G.players[G.ms].name}: 연결 끊김 — 자동 진행`);handleReq(G.ms,{a:'main'})}
},3000);
function onGuestPeers(){
  if(C.mode!=='guest')return;
  const host=roomPeers().find(pe=>!pe.isMe&&pe.presence&&pe.presence.host===1&&pe.presence.code===C.code);
  C.hostSeenAt=host?Date.now():(C.hostSeenAt||Date.now());
  if(!host){if(!C.S)renderWait();return}
  const st=host.presence.st;
  if(st&&st.pl){
    const idx=st.pl.findIndex(p=>p.cid===C.cid);
    if(!C.inGame){C.inGame=true;C.seat=idx;C.S=null;C.fxInit=false;C.lastLog=0;C.logs=[];C.resultShown=false;enterGame()}
    C.seat=idx;applyState(st);
  }else{
    if(C.inGame){C.inGame=false;C.S=null;PIECES=[];$('#hud').classList.add('hidden');closeSheet()}
    renderWait(host.presence.lob);
  }
}

   <div class="lab">💪 파워 주사위 (꾹 눌러 게이지)</div>${segHTML('sPow',[[1,'결과에 영향'],[0,'원작 규칙 (연출만)']],C.powerOn?1:0)}
   <button class="bigbtn b1" id="go" style="margin-top:20px">🏁 출발!</button><button class="bigbtn" id="back">← 뒤로</button></div>`);
  bindSeg('sBots',v=>C.soloBots=+v);bindSeg('sSpd',v=>C.speed=v);bindSeg('sFirst',v=>C.firstMe=v==='1');bindSeg('sPow',v=>{C.powerOn=v==='1';store.set('kart_pow',v)});
  $('#back').onclick=titleScreen;
  $('#go').onclick=()=>{SFX.play('myturn');C.mode='solo';C.seat=0;
    SP=FAST?{step:0,bot:0,dice:0,land:0,shot:0}:{slow:{step:520,bot:1400,dice:1500,land:1500,shot:1900},normal:{step:380,bot:1000,dice:1300,land:1150,shot:1600},fast:{step:210,bot:500,dice:900,land:650,shot:1000}}[C.speed];
    newGame([{nm:C.nm,cid:C.cid},...Array.from({length:C.soloBots},()=>({bot:true}))],!C.firstMe,C.powerOn);startEngine()};
}
function enterGame(){hideScr();$('#hud').classList.remove('hidden');cam.init=false;follow();SFX.bgmStart()}
function startEngine(){
  C.S=null;C.fxInit=true;C.lastFx=0;C.lastLog=0;C.logs=[];C.resultShown=false;PIECES=[];
  enterGame();publish();loop().catch(e=>{console.error(e);log('오류: '+e.message)});
}
async function createRoom(){
  scr(`<div class="scr"><div class="logo" style="font-size:28px">🏠 방 만드는 중</div><p><span class="spin"></span></p><div id="cerr" class="err"></div></div>`);
  const api=await getRoomApi();
  if(!api){roomError();return}
  try{
    for(let t=0;;t++){C.code=String(1000+Math.random()*9000|0);
      try{C.room=await api.join('kart-'+C.code,'host');break}catch(e){if(t<3&&e&&e.type==='unavailable-id')continue;throw e}}
    C.mode='host';C.seat=0;C.lobby=true;
    await C.room.presence({cid:C.cid,nm:C.nm,host:1,code:C.code,lob:{list:[C.nm]},st:null});
    C.room.onPeers(onHostPeers,()=>{});
    renderLobby();
  }catch(e){roomError(e)}
}
function roomError(e){
  scr(`<div class="scr"><div class="logo" style="font-size:28px">😢 멀티 연결 불가</div>
   <div class="err">이 화면에서는 기기끼리 연결할 수 없어요.</div>
   <div class="hint">• Claude 안에서: 로그인한 상태로 열고, 친구는 공유 메뉴에서 <b>초대받은 계정</b>으로 열어야 해요.<br>• Claude 계정이 없는 친구와는: 이 게임 파일을 웹에 올린 <b>온라인 버전 링크</b>로 둘 다 들어오거나, 아래 <b>한 폰으로 같이하기</b>를 이용하세요.<br>${e?`<span class="muted">(${esc(e.type||e.code||e.message||e)})</span>`:''}</div>
   <button class="bigbtn b2" id="loc">👥 한 폰으로 같이하기</button><button class="bigbtn b1" id="back">← 처음으로</button></div>`);
  $('#back').onclick=titleScreen;$('#loc').onclick=localScreen;
}
function renderLobby(){
  const guests=guestList();const total=1+guests.length;const maxB=4-total;
  if(C.lobBots>maxB)C.lobBots=maxB;if(total+C.lobBots<2)C.lobBots=Math.min(1,maxB);
  const list=[C.nm,...guests.map(g=>g.nm)];
  const lob={list,bots:C.lobBots,po:C.powerOn?1:0},lj=JSON.stringify(lob);
  if(C.room&&C.lastLob!==lj){C.lastLob=lj;C.room.presence({lob}).catch(()=>{})}
  if(!C.lobby)return;
  const sig=lj+'|'+guests.map(g=>g.cid).join(',');if(C.lobSig===sig&&$('#lBots'))return;C.lobSig=sig;
  const s=$('#screen');
  s.className='';s.classList.remove('hidden');
  s.innerHTML=`<div class="scr"><div class="sub" style="margin:0">방 코드</div><div class="code">${C.code}</div><div class="sub">친구에게 이 코드를 알려주세요</div>
   <div class="plist">${list.map((n,i)=>`<div><i style="background:${COLORS[i]}"></i>${esc(n)}${i===0?' 👑 (나)':''}</div>`).join('')}${Array.from({length:C.lobBots},(_,j)=>`<div><i style="background:${COLORS[total+j]}"></i>🤖 봇${j+1}</div>`).join('')}</div>
   <div class="lab">봇 추가</div>${segHTML('lBots',Array.from({length:maxB+1},(_,i)=>[i,i+'명']),C.lobBots)}
   <div class="lab">💪 파워 주사위</div>${segHTML('lPow',[[1,'결과에 영향'],[0,'원작 규칙 (연출만)']],C.powerOn?1:0)}
   <button class="bigbtn b1" id="go" ${total+C.lobBots<2?'disabled':''}>🏁 게임 시작 (${total+C.lobBots}명)</button>
   <button class="bigbtn" id="back">← 방 나가기</button>
   <div class="hint">친구는 이 게임 페이지를 <b>초대받은 계정</b>으로 열고 → 닉네임 → <b>방 참가하기</b> → 코드 입력.<br>(공유 메뉴에서 친구의 Claude 계정 이메일을 초대해 주세요)</div></div>`;
  bindSeg('lBots',v=>{C.lobBots=+v;renderLobby()});bindSeg('lPow',v=>{C.powerOn=v==='1';store.set('kart_pow',v);C.lobSig=null;renderLobby()});
  $('#back').onclick=()=>{C.lobby=false;C.mode=null;try{C.room.leave()}catch(e){}C.room=null;titleScreen()};
  $('#go').onclick=()=>{
    const gs=guestList();SFX.play('myturn');C.lobby=false;
    newGame([{nm:C.nm,cid:C.cid},...gs.map(g=>({nm:g.nm,cid:g.cid})),...Array.from({length:Math.min(C.lobBots,3-gs.length)},()=>({bot:true}))],true,C.powerOn);
    C.lastRqId={};roomPeers().forEach(pe=>{const pr=pe.presence||{};if(pr.cid)C.lastRqId[pr.cid]=pr.rq?pr.rq.id:null});
    C.room.presence({lob:null}).catch(()=>{});C.lastLob=null;C.lobSig=null;
    SP=FAST?{step:0,bot:0,dice:0,land:0,shot:0}:{step:380,bot:1000,dice:1300,land:1150,shot:1600};
    startEngine();
  };
}
function joinScreen(){
  scr(`<div class="scr"><div class="logo" style="font-size:28px">🔑 방 참가</div><div class="flag"></div>
   <input class="inp" id="code" inputmode="numeric" maxlength="4" placeholder="방 코드 4자리" style="font-size:28px;letter-spacing:8px">
   <button class="bigbtn b3" id="go">입장하기</button><button class="bigbtn" id="back">← 뒤로</button><div id="jerr" class="err"></div></div>`);
  $('#back').onclick=titleScreen;
  $('#go').onclick=async()=>{const code=$('#code').value.trim();if(!/^\d{4}$/.test(code)){$('#jerr').textContent='4자리 숫자 코드를 입력해 주세요.';return}
    $('#go').disabled=true;$('#go').innerHTML='<span class="spin"></span> 연결 중';
    const api=await getRoomApi();if(!api){roomError();return}
    try{C.code=code;C.room=await api.join('kart-'+code,'guest');C.mode='guest';C.inGame=false;
      await C.room.presence({cid:C.cid,nm:C.nm});C.room.onPeers(onGuestPeers,()=>{});renderWait()}catch(e){roomError(e)}};
}
function renderWait(lob){
  if(C.inGame)return;
  scr(`<div class="scr"><div class="sub" style="margin:0">방 코드</div><div class="code">${esc(C.code)}</div>
   ${lob?`<div class="plist">${(lob.list||[]).map((n,i)=>`<div><i style="background:${COLORS[i]}"></i>${esc(n)}${i===0?' 👑':''}</div>`).join('')}${Array.from({length:lob.bots||0},(_,j)=>`<div><i style="background:${COLORS[(lob.list||[]).length+j]}"></i>🤖 봇${j+1}</div>`).join('')}</div>
   <p class="sub" style="margin-top:10px">💪 파워 주사위: ${lob.po?'결과에 영향':'원작 규칙 (연출만)'}</p><p class="sub"><span class="spin"></span> 방장이 시작하면 자동으로 들어가요</p>`:`<p class="sub"><span class="spin"></span> 방장을 찾는 중… 코드가 맞는지 확인해 주세요</p>`}
   <button class="bigbtn" id="back">← 나가기</button></div>`);
  $('#back').onclick=()=>{C.mode=null;try{C.room.leave()}catch(e){}C.room=null;titleScreen()};
}
function showResults(){
  const S=C.S;if(!S)return;closeSheet();
  const fin=S.fo.map(i=>S.pl[i]),rest=S.pl.filter(p=>!p.f);
  const medal=['🥇','🥈','🥉','🏅'];
  const s=$('#screen');s.className='over';s.classList.remove('hidden');
  s.innerHTML=`<div class="scr"><div class="logo" style="font-size:34px">🏁 레이스 종료!</div><div class="flag"></div>
   ${fin.map((p,i)=>`<div class="rank" style="border:2px solid ${p.c}">${medal[i]} <span style="color:${p.c}">${esc(p.n)}</span><span style="margin-left:auto">${i+1}등</span></div>`).join('')}
   ${rest.length?`<div class="rank">🐢 ${rest.map(p=>`<span style="color:${p.c}">${esc(p.n)}</span>`).join(', ')}<span style="margin-left:auto;font-size:14px">꼴찌</span></div>`:''}
   ${C.mode==='guest'?'<p class="sub" style="margin-top:14px">방장이 로비로 돌아가면 다시 할 수 있어요</p>':`<button class="bigbtn b1" id="again">🔁 ${C.mode==='host'?'로비로 (같은 방)':'다시 하기'}</button>`}
   <button class="bigbtn" id="view">🗺️ 지도 보기</button><button class="bigbtn" id="home">🏠 처음으로</button></div>`;
  confetti();SFX.play('finish');
  $('#view').onclick=()=>hideScr();
  $('#home').onclick=()=>location.reload();
  const ag=$('#again');if(ag)ag.onclick=()=>{
    if(C.mode==='host'){G=null;C.S=null;PIECES=[];$('#hud').classList.add('hidden');C.lobby=true;C.lastLob=null;C.lobSig=null;C.room.presence({st:null}).catch(()=>{});renderLobby()}
    else if(C.mode==='local')localScreen();else soloScreen()};
}

titleScreen();
requestAnimationFrame(frame);
if(TEST){C.mode='solo';C.seat=0;SP={step:0,bot:0,dice:0,land:0,shot:0};newGame([{bot:1},{bot:1},{bot:1},{bot:1}]);startEngine()}
</script>
</body>
